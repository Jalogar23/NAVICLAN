<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#183b35"><title>NAVICLAN · Gestión scout</title><style>
:root{--bg:#f6f5ef;--paper:#fffefa;--ink:#20352f;--muted:#718078;--line:#e6e7df;--green:#183b35;--gold:#e7c85a;--blue:#3289D8;--yellow:#E8C52A;--troop:#319B59;--brown:#93613D;--red:#D94747;--shadow:0 8px 28px #1c35220b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--green);color:white;font-weight:650}button.secondary{background:#edf0e9;color:var(--ink)}button.warn{background:#fbe9e6;color:#9a352d}button.small{padding:7px 10px;font-size:13px}.top{background:var(--green);color:white;padding:16px max(18px,calc((100% - 1200px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;letter-spacing:1.4px;font-size:21px}.brand small{display:block;font-size:11px;font-weight:500;letter-spacing:0;opacity:.7}.demo{background:#fff1bc;color:#604d16;text-align:center;padding:8px 12px;font-size:13px}.layout{max-width:1200px;margin:auto;padding:22px 18px 80px;display:grid;grid-template-columns:220px 1fr;gap:22px}.nav{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:10px;height:max-content;position:sticky;top:14px}.nav button{display:block;width:100%;text-align:left;background:transparent;color:var(--ink);margin:3px 0}.nav button.active,.nav button:hover{background:#eaf0e9}.main{min-width:0}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.heading h1{margin:0;font-size:26px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:var(--shadow);min-width:0}.metric{font-size:27px;font-weight:850;margin-top:4px}.label{font-size:13px;color:var(--muted)}.panel{margin-top:16px}.panel h2{font-size:17px;margin:0 0 12px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.toolbar input,.toolbar select,input,select{border:1px solid var(--line);border-radius:9px;background:white;padding:9px 10px;color:var(--ink);max-width:100%}.toolbar input{flex:1;min-width:170px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:12px;color:var(--muted);font-weight:700}.pill{display:inline-block;border-radius:30px;padding:4px 8px;font-size:11px;font-weight:750;background:#edf0e9}.section{color:white}.empty{padding:28px;text-align:center;color:var(--muted)}.mobile-nav{display:none}.modal{position:fixed;inset:0;background:#14251fc0;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.modal.show{display:flex}.dialog{background:var(--paper);border-radius:16px;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto}.dialog h2{margin:0 0 14px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}.field input,.field select{width:100%}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.notice{font-size:12px;color:var(--muted);margin-top:16px}.row-actions{display:flex;gap:6px}.section-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}@media(max-width:800px){.layout{display:block;padding:16px 12px 90px}.nav{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.heading h1{font-size:22px}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:3}.mobile-nav button{background:transparent;color:var(--ink);font-size:11px;padding:5px}.mobile-nav button.active{color:#21744d;background:#edf4ed}.top{padding:13px 15px}.top .sub{display:none}}@media(max-width:440px){.grid{gap:8px}.card{padding:12px}.metric{font-size:23px}.fields{grid-template-columns:1fr}.heading{align-items:flex-start;flex-direction:column}.heading button{width:100%}}

.login-screen{min-height:100vh;display:none;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.login-card{width:min(420px,100%);background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:var(--shadow)}
.login-card h1{margin:0 0 6px}.login-card p{color:var(--muted)}.login-card label{display:flex;flex-direction:column;gap:6px;margin:14px 0;color:var(--muted);font-size:13px}.login-card input{width:100%}.login-card button{width:100%;margin-top:8px}.login-error{color:#a33b32;font-size:13px;min-height:20px}

@media(max-width:600px){
  html,body{max-width:100%;overflow-x:hidden}
  .layout,.main{width:100%;min-width:0}
  .card.tablewrap{padding:12px;overflow:visible}
  .tablewrap table,.tablewrap tbody{display:block;width:100%}
  .tablewrap thead{display:none}
  .tablewrap tr{display:block;padding:10px 0;border-bottom:1px solid var(--line)}
  .tablewrap tr:last-child{border-bottom:0}
  .tablewrap td{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
    width:100%;padding:7px 0;white-space:normal;border-bottom:0;text-align:right;overflow-wrap:anywhere}
  .tablewrap td:before{content:attr(data-label);font-size:12px;font-weight:700;color:var(--muted);
    text-align:left;flex:0 0 38%;max-width:38%}
  .tablewrap td:last-child{justify-content:flex-end;flex-wrap:wrap}
  .tablewrap td:last-child:before{margin-right:auto}
  .tablewrap td button{max-width:100%;white-space:normal}
  .toolbar>*{min-width:0;max-width:100%}
}
</style></head><body><header class="top"><div class="brand">⚜ NAVICLAN<small>Gestión de entradas · Grupo scout</small></div><div class="sub">Organización sencilla, todo en un sitio</div></header><div class="demo" id="cloudStatus">NAVICLAN · Conectando con la base de datos…</div><section class="login-screen" id="loginScreen"><div class="login-card"><div class="brand">⚜ NAVICLAN<small>Acceso de scouters</small></div><h1>Iniciar sesión</h1><p>Introduce las credenciales compartidas del grupo scout.</p><form id="loginForm"><label>Correo electrónico<input id="loginEmail" type="email" autocomplete="username" required></label><label>Contraseña<input id="loginPassword" type="password" autocomplete="current-password" required></label><div class="login-error" id="loginError"></div><button type="submit" id="loginButton">Entrar en NAVICLAN</button></form></div></section><div class="layout" id="appLayout"><aside class="nav" id="nav"></aside><main class="main" id="app"></main></div><nav class="mobile-nav" id="mnav"></nav><div class="modal" id="modal"><div class="dialog" id="dialog"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SECTIONS={castores:['Castores','#3289D8'],manada:['Manada','#E8C52A'],tropa:['Tropa','#319B59'],esculta:['Esculta','#93613D'],rover:['Rover','#D94747']};const money=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n||0);const date=()=>new Date().toISOString().slice(0,10);const uid=()=>Math.random().toString(36).slice(2,10);const seed={price:6,event:'Fiesta de Navidad',group:'Grupo Scout',families:[{id:'f1',name:'Familia García',separated:false},{id:'f2',name:'Familia López',separated:true},{id:'f3',name:'Familia Martínez',separated:false}],children:[{id:'c1',first:'Lucía',last:'García',section:'castores',family:'f1'},{id:'c2',first:'Mateo',last:'García',section:'tropa',family:'f1'},{id:'c3',first:'Nora',last:'López',section:'manada',family:'f2'},{id:'c4',first:'Hugo',last:'Martínez',section:'esculta',family:'f3'}],requests:[{id:'r1',family:'f1',date:date(),qty:3,granted:1}],payments:[{id:'p1',family:'f1',amount:12,date:date(),method:'Bizum'}],deliveries:[{id:'d1',family:'f1',qty:1,date:date(),recipient:'Tutor/a'}]};let db;try{db=JSON.parse(localStorage.naviclan||'null')||seed}catch{db=seed}let page='panel',search='',sectionFilter='todas';function save(){localStorage.naviclan=JSON.stringify(db)}function fam(id){return db.families.find(x=>x.id===id)||{name:'—'}}function granted(f){return db.requests.filter(r=>r.family===f.id).reduce((a,r)=>a+r.granted,0)}function tickets(f){return 2+granted(f)}function paid(f){return db.payments.filter(p=>p.family===f.id).reduce((a,p)=>a+p.amount,0)}function handed(f){return db.deliveries.filter(d=>d.family===f.id).reduce((a,d)=>a+d.qty,0)}function due(f){return tickets(f)*db.price}function pending(f){return Math.max(0,due(f)-paid(f))}function undelivered(f){return Math.max(0,tickets(f)-handed(f))}function labelSection(s){return `<span class="section-dot" style="background:${SECTIONS[s][1]}"></span>${SECTIONS[s][0]}`}function nav(){let items=[['panel','▦','Panel'],['familias','♧','Familias'],['ninos','♙','Niños'],['solicitudes','☷','Solicitudes'],['pagos','€','Pagos'],['entregas','↗','Entregas'],['datos','⇅','Datos'],['ajustes','⚙','Ajustes']];document.querySelector('#nav').innerHTML=items.map(([id,ic,t])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${ic}　${t}</button>`).join('');document.querySelector('#mnav').innerHTML=items.slice(0,5).map(([id,ic,t])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${ic}<br>${t}</button>`).join('')+`<button onclick="go('mas')">☰<br>Más</button>`}function go(p){page=p==='mas'?'solicitudes':p;render()}function heading(title,action=''){return `<div class="heading"><div><h1>${title}</h1><div class="muted">${db.event} · ${db.group}</div></div>${action}</div>`}function table(headers,rows){return `<div class="card tablewrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||''}</tbody></table>${rows?'':'<div class="empty">No hay registros.</div>'}</div>`}function render(){nav();let html='';if(page==='panel'){let fams=db.families;html=heading('Resumen',`<button onclick="openForm('family')">＋ Nueva familia</button>`)+`<div class="grid">${[['Familias',fams.length],['Niños y niñas',db.children.length],['Entradas asignadas',fams.reduce((a,f)=>a+tickets(f),0)],['Pendiente de cobro',money(fams.reduce((a,f)=>a+pending(f),0))]].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="metric">${x[1]}</div></div>`).join('')}</div><div class="grid panel"><div class="card"><div class="label">Solicitudes pendientes</div><div class="metric">${db.requests.filter(r=>r.granted===0).length}</div></div><div class="card"><div class="label">Familias con pagos pendientes</div><div class="metric">${fams.filter(f=>pending(f)>0).length}</div></div><div class="card"><div class="label">Familias con entradas por entregar</div><div class="metric">${fams.filter(f=>undelivered(f)>0).length}</div></div><div class="card"><div class="label">Precio por entrada</div><div class="metric">${money(db.price)}</div></div></div><div class="panel card"><h2>Resumen por sección</h2>${Object.entries(SECTIONS).map(([k,v])=>`<p>${labelSection(k)} <strong style="float:right">${db.children.filter(c=>c.section===k).length}</strong></p>`).join('')}</div>`}
if(page==='familias'){html=heading('Familias',`<button onclick="openForm('family')">＋ Nueva familia</button>`)+`<div class="toolbar"><input placeholder="Buscar familia…" oninput="search=this.value;render()" value="${search}"></div>`+table(['Familia','Niños','Entradas','Pagado','Pendiente','Por entregar','Acciones'],db.families.filter(f=>f.name.toLowerCase().includes(search.toLowerCase())).map(f=>`<tr><td><b>${f.name}</b>${f.separated?'<br><span class="pill">Padres separados</span>':''}</td><td>${db.children.filter(c=>c.family===f.id).length}</td><td>${tickets(f)}</td><td>${money(paid(f))}</td><td>${money(pending(f))}</td><td>${undelivered(f)}</td><td><button class="small secondary" onclick="familyDetail('${f.id}')">Ver / gestionar</button></td></tr>`).join(''))}
if(page==='ninos'){let visibleChildren=db.children.filter(c=>(c.first+' '+c.last).toLowerCase().includes(search.toLowerCase())&&(sectionFilter==='todas'||c.section===sectionFilter));html=heading('Niños y niñas',`<button onclick="openForm('child')">＋ Añadir niño/a</button>`)+`<div class="toolbar"><input placeholder="Buscar por nombre o apellidos" oninput="search=this.value;render()" value="${search}"><select aria-label="Filtrar por sección" onchange="sectionFilter=this.value;render()"><option value="todas" ${sectionFilter==='todas'?'selected':''}>Todas las secciones (${db.children.length})</option>${Object.entries(SECTIONS).map(([k,v])=>`<option value="${k}" ${sectionFilter===k?'selected':''}>${v[0]} (${db.children.filter(c=>c.section===k).length})</option>`).join('')}</select></div><p class="muted" style="font-size:13px;margin:0 0 10px">Mostrando ${visibleChildren.length} de ${db.children.length} niños y niñas.</p>`+table(['Nombre','Apellidos','Sección','Familia','Acciones'],visibleChildren.map(c=>`<tr><td>${c.first}</td><td>${c.last}</td><td>${labelSection(c.section)}</td><td>${fam(c.family).name}</td><td><button class="small secondary" onclick="openForm('child','${c.id}')">Editar</button> <button class="small warn" onclick="del('children','${c.id}')">Borrar</button></td></tr>`).join(''))}
if(page==='solicitudes'){html=heading('Solicitudes de entradas extra',`<button onclick="openForm('request')">＋ Nueva solicitud</button>`)+table(['Fecha','Familia','Solicitadas','Concedidas','Estado','Acciones'],db.requests.map(r=>`<tr><td>${r.date}</td><td>${fam(r.family).name}</td><td>${r.qty}</td><td>${r.granted}</td><td><span class="pill">${r.granted===0?'Pendiente':r.granted<r.qty?'Parcial': 'Aprobada'}</span></td><td><button class="small" onclick="grant('${r.id}')">Resolver</button></td></tr>`).join(''))}
if(page==='pagos'){html=heading('Pagos pendientes')+table(['Familia','Total','Pagado','Pendiente','Acción'],db.families.filter(f=>pending(f)>0).map(f=>`<tr><td>${f.name}</td><td>${money(due(f))}</td><td>${money(paid(f))}</td><td><b>${money(pending(f))}</b></td><td><button class="small" onclick="openForm('payment','${f.id}')">Registrar pago</button></td></tr>`).join(''))}
if(page==='entregas'){html=heading('Entradas por entregar')+table(['Familia','Asignadas','Entregadas','Pendientes','Acción'],db.families.filter(f=>undelivered(f)>0).map(f=>`<tr><td>${f.name}</td><td>${tickets(f)}</td><td>${handed(f)}</td><td><b>${undelivered(f)}</b></td><td><button class="small" onclick="openForm('delivery','${f.id}')">Registrar entrega</button></td></tr>`).join(''))}
if(page==='datos'){html=heading('Importar y exportar')+`<div class="card"><h2>Exportar datos</h2><p class="muted">Descarga una copia CSV de familias, niños y niñas.</p><button onclick="exportCSV()">⇩ Exportar niños y familias</button><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h2>Importar niños y niñas</h2><p class="muted">CSV con columnas: nombre, apellidos, sección, familia. Se añaden los registros al listado.</p><input type="file" accept=".csv,text/csv" id="csvfile"><button onclick="importCSV()">Importar CSV</button></div>`}
if(page==='ajustes'){html=heading('Ajustes')+`<div class="card"><h2>Evento y grupo</h2><div class="fields"><label class="field">Nombre del grupo<input id="group" value="${db.group}"></label><label class="field">Evento<input id="event" value="${db.event}"></label><label class="field">Precio por entrada (€)<input id="price" type="number" min="0" step="0.5" value="${db.price}"></label></div><p><button onclick="saveSettings()">Guardar ajustes</button></p><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h2>Datos de demostración</h2><button class="warn" onclick="if(confirm('¿Restablecer todos los datos de ejemplo?')){db=structuredClone(seed);save();render()}">Restablecer demo</button><p class="notice">Los datos se guardan localmente en este navegador. No hay sincronización entre dispositivos.</p></div>`}document.querySelector('#app').innerHTML=html;
document.querySelectorAll('#app table').forEach(t=>{
  const labels=[...t.querySelectorAll('thead th')].map(th=>th.textContent.trim());
  t.querySelectorAll('tbody tr').forEach(tr=>{
    [...tr.children].forEach((td,i)=>td.setAttribute('data-label',labels[i]||''));
  });
});
}
function openModal(content){document.querySelector('#dialog').innerHTML=content;document.querySelector('#modal').classList.add('show')}function closeModal(){document.querySelector('#modal').classList.remove('show')}function openForm(type,id=''){let obj=id?(type==='child'?db.children.find(x=>x.id===id):fam(id)):{};let fields='';if(type==='family')fields=`<label class="field">Nombre de familia<input id="fname" value="${obj.name||''}"></label><label class="field">Padres separados<select id="sep"><option value="false">No</option><option value="true" ${obj.separated?'selected':''}>Sí</option></select></label>`;if(type==='child')fields=`<label class="field">Nombre<input id="first" value="${obj.first||''}"></label><label class="field">Apellidos<input id="last" value="${obj.last||''}"></label><label class="field">Sección<select id="section">${Object.entries(SECTIONS).map(([k,v])=>`<option value="${k}" ${obj.section===k?'selected':''}>${v[0]}</option>`).join('')}</select></label><label class="field">Familia<select id="family">${db.families.map(f=>`<option value="${f.id}" ${obj.family===f.id?'selected':''}>${f.name}</option>`).join('')}</select></label>`;if(type==='request')fields=`<label class="field">Familia<select id="family">${db.families.map(f=>`<option value="${f.id}">${f.name}</option>`).join('')}</select></label><label class="field">Fecha<input id="dt" type="date" value="${date()}"></label><label class="field">Entradas solicitadas<input id="qty" type="number" min="1" value="1"></label>`;if(type==='payment')fields=`<label class="field">Importe (€)<input id="amount" type="number" min="0.01" step="0.01" value="${pending(fam(id))}"></label><label class="field">Fecha<input id="dt" type="date" value="${date()}"></label><label class="field">Método<select id="method"><option>Efectivo</option><option>Bizum</option><option>Transferencia</option></select></label>`;if(type==='delivery')fields=`<label class="field">Cantidad<input id="qty" type="number" min="1" max="${undelivered(fam(id))}" value="${undelivered(fam(id))}"></label><label class="field">Fecha<input id="dt" type="date" value="${date()}"></label><label class="field">Entregado a<input id="recipient" value="Tutor/a"></label>`;openModal(`<h2>${({family:id?'Editar familia':'Nueva familia',child:id?'Editar niño/a':'Añadir niño/a',request:'Nueva solicitud',payment:'Registrar pago',delivery:'Registrar entrega'})[type]}</h2><div class="fields">${fields}</div><div class="dialog-actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button onclick="saveForm('${type}','${id}')">Guardar</button></div>`)}function val(id){return document.getElementById(id)?.value||''}function saveForm(t,id){if(t==='family'){if(!val('fname').trim())return alert('Escribe el nombre de la familia');if(id){let f=fam(id);f.name=val('fname');f.separated=val('sep')==='true'}else db.families.push({id:uid(),name:val('fname'),separated:val('sep')==='true'})}if(t==='child'){let x={id:id||uid(),first:val('first'),last:val('last'),section:val('section'),family:val('family')};if(!x.first||!x.last)return alert('Completa nombre y apellidos');if(id)Object.assign(db.children.find(c=>c.id===id),x);else db.children.push(x)}if(t==='request')db.requests.push({id:uid(),family:val('family'),date:val('dt'),qty:+val('qty'),granted:0});if(t==='payment')db.payments.push({id:uid(),family:id,date:val('dt'),amount:+val('amount'),method:val('method')});if(t==='delivery')db.deliveries.push({id:uid(),family:id,date:val('dt'),qty:+val('qty'),recipient:val('recipient')});save();closeModal();render()}function grant(id){let r=db.requests.find(x=>x.id===id);openModal(`<h2>Resolver solicitud</h2><p>${fam(r.family).name} ha pedido ${r.qty} entradas extra.</p><label class="field">Cantidad concedida<input id="granted" type="number" min="0" max="${r.qty}" value="${r.granted}"></label><div class="dialog-actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button onclick="let n=+val('granted');if(n<0||n>${r.qty})return alert('Cantidad no válida');r.granted=n;save();closeModal();render()">Guardar concesión</button></div>`)}function familyDetail(id){let f=fam(id);openModal(`<h2>${f.name}</h2><p>${db.children.filter(c=>c.family===id).map(c=>c.first+' '+c.last+' · '+SECTIONS[c.section][0]).join('<br>')||'Sin niños registrados'}</p><p>Entradas: ${tickets(f)} · Pagado: ${money(paid(f))} · Pendiente: ${money(pending(f))} · Por entregar: ${undelivered(f)}</p><div class="row-actions"><button class="small" onclick="closeModal();openForm('request')">Pedir extra</button><button class="small secondary" onclick="closeModal();openForm('payment','${id}')">Registrar pago</button><button class="small secondary" onclick="closeModal();openForm('delivery','${id}')">Entregar</button></div><div class="dialog-actions"><button class="secondary" onclick="closeModal()">Cerrar</button><button onclick="closeModal();openForm('family','${id}')">Editar familia</button><button class="warn" onclick="deleteFamily('${id}')">Eliminar familia</button></div>`)}function deleteFamily(id){let f=db.families.find(x=>x.id===id);if(!f)return;let n=db.children.filter(c=>c.family===id).length;let r=db.requests.filter(x=>x.family===id).length;let p=db.payments.filter(x=>x.family===id).length;let d=db.deliveries.filter(x=>x.family===id).length;openModal(`<h2>¿Eliminar familia?</h2><p>Vas a eliminar definitivamente <strong>${f.name}</strong>.</p><p>También se eliminarán ${n} niño(s), ${r} solicitud(es), ${p} pago(s) y ${d} entrega(s) asociados.</p><p class="muted">Esta acción no se puede deshacer.</p><div class="dialog-actions"><button class="secondary" onclick="familyDetail('${id}')">Cancelar</button><button class="warn" onclick="confirmDeleteFamily('${id}')">Sí, eliminar familia</button></div>`)}function confirmDeleteFamily(id){if(!db.families.some(x=>x.id===id))return;db.families=db.families.filter(x=>x.id!==id);db.children=db.children.filter(x=>x.family!==id);db.requests=db.requests.filter(x=>x.family!==id);db.payments=db.payments.filter(x=>x.family!==id);db.deliveries=db.deliveries.filter(x=>x.family!==id);save();closeModal();render()}function del(type,id){if(confirm('¿Seguro que quieres borrar este registro?')){db[type]=db[type].filter(x=>x.id!==id);save();render()}}function saveSettings(){db.group=val('group');db.event=val('event');db.price=Math.max(0,+val('price'));save();render()}function exportCSV(){let lines=['nombre;apellidos;seccion;familia;padres_separados',...db.children.map(c=>[c.first,c.last,c.section,fam(c.family).name,fam(c.family).separated?'si':'no'].join(';'))];let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'}));a.download='naviclan_datos.csv';a.click()}function importCSV(){let f=document.querySelector('#csvfile').files[0];if(!f)return alert('Selecciona un CSV');let rd=new FileReader();rd.onload=()=>{let rows=String(rd.result).replace(/^\uFEFF/,'').split(/\r?\n/).slice(1);for(let line of rows){if(!line.trim())continue;let [first,last,section,family]=line.split(/[;,]/).map(x=>x.trim());let key=Object.keys(SECTIONS).find(k=>k===section?.toLowerCase()||SECTIONS[k][0].toLowerCase()===section?.toLowerCase());if(!first||!last||!key)continue;let famObj=db.families.find(x=>x.name.toLowerCase()===family?.toLowerCase());if(!famObj){famObj={id:uid(),name:family||last,separated:false};db.families.push(famObj)}db.children.push({id:uid(),first,last,section:key,family:famObj.id})}save();render();alert('Importación terminada')};rd.readAsText(f)}render();

<script>
// NAVICLAN Cloud: autenticación y sincronización Supabase.
(() => {
  const SUPABASE_URL = 'https://wfbljslraaxwdrdmnoml.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_SSB0CcdANYlbv3HXJSKdmg_WbXm1mJ1';
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const originalRender = render;
  let cloudSession = null, cloudBusy = false, polling = null;
  let baseline = {families:[], children:[], requests:[], payments:[], deliveries:[], settings:null};
  const status = (msg, bad=false) => { const el=document.getElementById('cloudStatus'); if(el){el.textContent=msg;el.style.background=bad?'#fbe9e6':'#e6f1e8';el.style.color=bad?'#9a352d':'#24543b';} };

    document.getElementById('cloudStatus').style.display='none';

    document.getElementById('loginScreen').style.display='none';
    document.getElementById('appLayout').style.display='grid';

    document.getElementById('cloudStatus').style.display='block';
    status('NAVICLAN · Conectado y sincronizado');
    originalRender();
  };
  render = function(){ if(cloudSession) originalRender(); else showLogin(); };
  const snapshot = () => ({
    families: db.families.map(x=>({...x})), children: db.children.map(x=>({...x})),
    requests: db.requests.map(x=>({...x})), payments: db.payments.map(x=>({...x})),
    deliveries: db.deliveries.map(x=>({...x})), settings:{group:db.group,event:db.event,price:db.price}
  });
  const mapRows = (key) => {
    if(key==='families') return db.families.map(x=>({id:x.id,name:x.name,separated:!!x.separated}));
    if(key==='children') return db.children.map(x=>({id:x.id,first_name:x.first,last_name:x.last,section:x.section,family_id:x.family}));
    if(key==='requests') return db.requests.map(x=>({id:x.id,family_id:x.family,request_date:x.date,quantity:+x.qty,granted:+x.granted}));

    if(key==='deliveries') return db.deliveries.map(x=>({id:x.id,family_id:x.family,delivery_date:x.date,quantity:+x.qty,recipient:x.recipient||'Tutor/a'}));
  };
  const loadCloud = async () => {
    const names=['settings','families','children','requests','payments','deliveries'];
    const results=await Promise.all(names.map(n=>client.from(n).select('*')));
    for(let i=0;i<results.length;i++) if(results[i].error) throw results[i].error;
    const [settings,families,children,requests,payments,deliveries]=results.map(r=>r.data||[]);
    const st=settings.find(x=>x.id==='main')||settings[0];

      deliveries:deliveries.map(x=>({id:x.id,family:x.family_id,date:x.delivery_date,qty:x.quantity,recipient:x.recipient}))};
    baseline=snapshot();
  };
  const syncCloud = async () => {
    if(!cloudSession || cloudBusy) return;
    cloudBusy=true; status('NAVICLAN · Guardando cambios…');
    try {
      const now=snapshot();
      for(const key of ['families','children','requests','payments','deliveries']){
        const oldIds=new Set(baseline[key].map(x=>x.id));
        const newIds=new Set(now[key].map(x=>x.id));
        const removed=[...oldIds].filter(id=>!newIds.has(id));
        if(removed.length){const {error}=await client.from(key).delete().in('id',removed);if(error)throw error;}
        const rows=mapRows(key);
        if(rows.length){const {error}=await client.from(key).upsert(rows);if(error)throw error;}
      }
      const {error:se}=await client.from('settings').upsert({id:'main',group_name:db.group,event_name:db.event,ticket_price:db.price,updated_at:new Date().toISOString()});
      if(se) throw se;
      baseline=snapshot(); status('NAVICLAN · Cambios guardados y sincronizados');
    } catch(e){console.error(e);status('Error al sincronizar: '+(e.message||'revisa la conexión y las políticas RLS'),true);alert('No se han podido guardar los cambios en la nube. '+(e.message||''));}
    finally{cloudBusy=false;}
  };
  save = function(){ localStorage.naviclan=JSON.stringify(db); syncCloud(); };
  document.getElementById('loginForm').addEventListener('submit',async e=>{
    e.preventDefault();const btn=document.getElementById('loginButton');btn.disabled=true;btn.textContent='Entrando…';

    btn.disabled=false;btn.textContent='Entrar en NAVICLAN';
    if(error){document.getElementById('loginError').textContent='No se ha podido iniciar sesión. Comprueba el correo y la contraseña.';return;}
    cloudSession=data.session;
    try{await loadCloud();showApp();startPolling();}catch(err){console.error(err);await client.auth.signOut();cloudSession=null;showLogin('Error al cargar la base de datos: '+err.message);}
  });
  async function startPolling(){if(polling)clearInterval(polling);polling=setInterval(async()=>{if(!cloudSession||cloudBusy)return;try{await loadCloud();originalRender();status('NAVICLAN · Sincronizado');}catch(e){status('Problema de sincronización',true);}},15000);}
  client.auth.getSession().then(async({data})=>{if(data.session){cloudSession=data.session;try{await loadCloud();showApp();startPolling();}catch(e){console.error(e);showLogin('No se han podido cargar los datos. '+e.message);}}else showLogin();});
  // Añade un cierre de sesión visible en la cabecera.
  const logout=document.createElement('button');logout.className='small secondary';logout.textContent='Salir';logout.style.marginLeft='12px';logout.onclick=async()=>{if(confirm('¿Cerrar sesión de NAVICLAN?')){await client.auth.signOut();cloudSession=null;if(polling)clearInterval(polling);showLogin();}};document.querySelector('.top').appendChild(logout);
})();
</script>
